<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- Primary SEO -->
  <title>DSocial — Social Media & Creative Agency in Mumbai</title>

  <meta
    name="description"
    content="DSocial is a social media and creative agency in Mumbai helping thoughtful brands build distinctive content, campaigns and digital identities."
  />

  <meta
    name="robots"
    content="index, follow, max-image-preview:large"
  />

  <link
    rel="canonical"
    href="https://dsocial.in/"
  />

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="/favicon.ico"
  />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />

  <meta
    property="og:url"
    content="https://dsocial.in/"
  />

  <meta
    property="og:title"
    content="DSocial — Social Media & Creative Agency in Mumbai"
  />

  <meta
    property="og:description"
    content="A social media and creative agency helping thoughtful brands build distinctive content, campaigns and digital identities."
  />

  <meta
    property="og:image"
    content="https://dsocial.in/og-image.png"
  />

  <meta
    property="og:image:alt"
    content="DSocial — Social Media & Creative Agency"
  />

  <meta property="og:site_name" content="DSocial" />

  <!-- Twitter / X -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="DSocial — Social Media & Creative Agency in Mumbai"
  />

  <meta
    name="twitter:description"
    content="A social media and creative agency helping thoughtful brands build distinctive content, campaigns and digital identities."
  />

  <meta
    name="twitter:image"
    content="https://dsocial.in/og-image.png"
  />

  <!-- Organization Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "DSocial",
      "alternateName": "d.social",
      "url": "https://dsocial.in/",
